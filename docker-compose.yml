version: "3.8"

services:
  db:
    image: postgres:16
    container_name: smarttimer_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pwd
      POSTGRES_DB: smarttimer
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
